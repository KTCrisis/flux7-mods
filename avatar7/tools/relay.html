<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>avatar7</title>
<style>
:root{--tone:#00ff9c;--bg:#05070a;--ink:#cfe9e6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
font:15px/1.5 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
#scene{position:fixed;inset:0;background:center/cover no-repeat;filter:brightness(.42) saturate(1.1);
transition:background-image .6s}
#stage{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;
justify-content:center;gap:18px;padding:16px}
#frame{position:relative;width:min(86vw,58vh);aspect-ratio:1;border:2px solid var(--tone);
box-shadow:0 0 24px color-mix(in srgb,var(--tone) 45%,transparent);background:#000;transition:border-color .3s,box-shadow .3s}
#frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#tint{position:absolute;inset:0;background:var(--tone);mix-blend-mode:color;opacity:0;transition:opacity .3s}
#frame.deny,#frame.error{animation:glitch .18s steps(2) infinite}
@keyframes glitch{0%{transform:translate(0,0)}50%{transform:translate(-3px,1px)}100%{transform:translate(2px,-1px)}}
#frame.wait{animation:breathe 2.5s ease-in-out infinite}
@keyframes breathe{50%{filter:brightness(.8)}}
#name{letter-spacing:.2em;text-transform:uppercase;color:var(--tone);font-size:13px}
#line{width:min(92vw,640px);min-height:6.5em;padding:12px 14px;background:rgba(0,0,0,.55);
border-left:2px solid var(--tone);white-space:pre-wrap}
#line::after{content:"_";animation:blink 1s steps(1) infinite;color:var(--tone)}
@keyframes blink{50%{opacity:0}}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
gap:12px;background:rgba(5,7,10,.88);z-index:2;cursor:pointer;color:#7fe7e1}
#gate b{border:1px solid currentColor;padding:.6em 1.6em;font-weight:normal}
#gate span{opacity:.6;font-size:13px}
#controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:min(92vw,640px)}
#controls button,#picker button,form button{background:rgba(0,0,0,.6);color:var(--ink);border:1px solid #2a3a3a;
font:inherit;font-size:13px;padding:.45em .9em;cursor:pointer}
#controls button.on{border-color:var(--tone);color:var(--tone)}
#vol{display:flex;align-items:center;gap:6px;font-size:13px}
#picker{display:none;flex-wrap:wrap;gap:6px;justify-content:center;width:min(92vw,640px)}
#picker.open{display:flex}
#picker button.cur{border-color:var(--tone);color:var(--tone)}
form{display:none;gap:6px;width:min(92vw,640px)}
form.open{display:flex}
form input{flex:1;min-width:0;background:#000;color:var(--ink);border:1px solid var(--tone);font:inherit;padding:.45em .6em}
#stage{overflow-y:auto}
#status{position:fixed;bottom:max(8px,env(safe-area-inset-bottom));left:12px;right:12px;text-align:center;
font-size:11px;opacity:.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body>
<div id="scene"></div>
<div id="stage">
  <div id="name">avatar7</div>
  <div id="frame"><img id="face" alt=""><div id="tint"></div></div>
  <div id="line"></div>
  <form id="answer"><input name="t" placeholder="answer" autocomplete="off"><button>answer</button></form>
  <form id="ask"><input name="t" placeholder="ask the avatar" autocomplete="off"><button>ask</button></form>
  <div id="picker"></div>
  <div id="controls">
    <button data-c="talk">talk</button>
    <button id="askBtn">ask</button>
    <button id="pickBtn">avatars</button>
    <button id="floatBtn">float</button>
    <button id="mute" data-c="mute">mute</button>
    <button id="events" data-c="events">events</button>
    <button id="visits" data-c="visits">visits</button>
    <span id="vol">vol <button data-v="-1">-</button><span id="volN">-</span><button data-v="1">+</button></span>
  </div>
</div>
<div id="gate"><b>listen</b><span>tap once: the browser plays nothing before a gesture</span></div>
<div id="status">waiting</div>
<canvas id="pipCanvas" width="320" height="440" hidden></canvas>
<video id="pipVideo" muted playsinline hidden></video>
<script>
const TINT = { watch: '#00e5ff', deny: '#ff2a6d', error: '#ffb000', wait: '#7a5cff' };
const MIX = { idle: 0, watch: .25, wait: .35, deny: .5, error: .5 };
const $ = id => document.getElementById(id);
const status = t => $('status').textContent = t;
const faces = {}; let st = null, files = [], persona = '', flapAt = 0;

// The voice: WAVs in arrival order, one at a time.
const queue = []; let busy = false; const audio = new Audio();
function next() {
  if (busy || !queue.length) return;
  busy = true; audio.src = '/wav/' + queue.shift();
  audio.play().catch(e => { status('blocked: ' + e.message); busy = false; });
}
audio.onended = audio.onerror = () => { busy = false; next(); };

async function loadPersona(id) {
  persona = id;
  files = await fetch('/persona/' + id + '/').then(r => r.json()).catch(() => []);
  for (const f of ['portrait', 'portrait-talk', 'portrait-deny']) {
    if (files.includes(f + '.png')) { const i = new Image(); i.src = `/persona/${id}/${f}.png`; faces[id + f] = i.src; }
  }
  $('scene').style.backgroundImage = files.includes('scene.png') ? `url(/persona/${id}/scene.png)` : 'none';
}

// The line, typed as the voice is heard HERE: the WAV reaches this tab later
// than the state does, so text and mouth follow the audio element, not void.
let text = '', seq = -1, shown = 0, rate = 1, typer = 0, fallback = 0;
function typeOver(ms) {
  clearInterval(typer); shown = 0;
  rate = Math.max(.2, text.length / Math.max(1, ms / 50));
  typer = setInterval(() => {
    shown = Math.min(text.length, shown + rate);
    $('line').textContent = text.slice(0, Math.floor(shown));
    if (shown >= text.length) clearInterval(typer);
  }, 50);
}
// An Ogg's duration needs a ranged read the relay does not serve: Infinity
// then, and void's own measure of the voice stands in.
audio.onplaying = () => {
  clearTimeout(fallback);
  typeOver(isFinite(audio.duration) && audio.duration > 0 ? audio.duration * 1000 : (st && st.speakMs) || text.length * 45);
};
const isHeard = () => !audio.paused && !audio.ended && audio.src.includes('/wav/');

function draw() {
  if (!st) return;
  const isDown = st.mood === 'deny' || st.mood === 'error';
  let f = 'portrait';
  if (isDown && faces[persona + 'portrait-deny']) f = 'portrait-deny';
  else if (isHeard() && faces[persona + 'portrait-talk'] && performance.now() < flapAt) f = 'portrait-talk';
  const src = faces[persona + f] || faces[persona + 'portrait'];
  if (src && $('face').src !== new URL(src, location).href) $('face').src = src;
}
// The mouth flaps at an uneven pace while the voice is heard.
setInterval(() => { if (isHeard() && Math.random() < .55) flapAt = performance.now() + 140; draw(); }, 160);

const send = body => fetch('/command', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => send({ cmd: b.dataset.c }));
document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => send({ cmd: 'volume', step: +b.dataset.v }));
$('askBtn').onclick = () => { $('ask').classList.toggle('open'); $('ask').t.focus(); };
$('pickBtn').onclick = () => $('picker').classList.toggle('open');
for (const [id, cmd] of [['ask', 'ask'], ['answer', 'answer']]) {
  $(id).onsubmit = e => {
    e.preventDefault(); const t = $(id).t.value.trim(); if (!t) return;
    send({ cmd, text: t }); $(id).t.value = ''; if (id === 'ask') $(id).classList.remove('open');
  };
}

// Floating: the face drawn into a canvas, the canvas as a video, the video in
// picture-in-picture over the other apps. Drawn on a timer, not on frames:
// a page in the background gets no animation frames.
const pc = $('pipCanvas'), pg = pc.getContext('2d'), pv = $('pipVideo');
// The face on top, the line typed beneath as subtitles: its last lines only.
const PIP_LINES = 4, PIP_FONT = 17;
function wrap(text, width) {
  const out = []; let cur = '';
  for (const w of text.split(' ')) {
    const t = cur ? cur + ' ' + w : w;
    if (pg.measureText(t).width > width && cur) { out.push(cur); cur = w; } else cur = t;
  }
  if (cur) out.push(cur);
  return out;
}
function drawPip() {
  const W = pc.width, F = W, img = $('face');
  pg.fillStyle = '#000'; pg.fillRect(0, 0, W, pc.height);
  if (img.complete && img.naturalWidth) pg.drawImage(img, 0, 0, F, F);
  const tone = getComputedStyle(document.documentElement).getPropertyValue('--tone').trim() || '#00ff9c';
  const mix = st ? (MIX[st.mood] ?? 0) : 0;
  if (mix > 0) {
    pg.globalCompositeOperation = 'color'; pg.globalAlpha = mix;
    pg.fillStyle = tone; pg.fillRect(0, 0, F, F);
    pg.globalCompositeOperation = 'source-over'; pg.globalAlpha = 1;
  }
  pg.font = `${PIP_FONT}px "JetBrains Mono", ui-monospace, monospace`;
  pg.fillStyle = '#cfe9e6'; pg.textBaseline = 'top';
  const lines = wrap($('line').textContent, W - 20).slice(-PIP_LINES);
  lines.forEach((l, i) => pg.fillText(l, 10, F + 10 + i * (PIP_FONT + 7)));
  pg.lineWidth = 6; pg.strokeStyle = tone; pg.strokeRect(3, 3, W - 6, pc.height - 6);
  pg.lineWidth = 2; pg.beginPath(); pg.moveTo(0, F); pg.lineTo(W, F); pg.stroke();
}
let pipTimer = 0;
$('floatBtn').onclick = async () => {
  try {
    if (document.pictureInPictureElement) { await document.exitPictureInPicture(); return; }
    drawPip();
    if (!pv.srcObject) pv.srcObject = pc.captureStream(15);
    await pv.play();
    clearInterval(pipTimer); pipTimer = setInterval(drawPip, 80);
    await pv.requestPictureInPicture();
    status('floating');
  } catch (e) { $('line').textContent = 'float failed: ' + e.name + ' ' + e.message; }
};
// The floating window draws no HTML on Android: only the media buttons Chrome
// puts in it, taken over here. Next: talk; play/pause: mute, the video kept on.
if ('mediaSession' in navigator) {
  const ms = navigator.mediaSession;
  ms.setActionHandler('nexttrack', () => send({ cmd: 'talk' }));
  for (const a of ['play', 'pause']) ms.setActionHandler(a, () => {
    send({ cmd: 'mute' }); pv.play().catch(() => {});
    ms.playbackState = st && !st.isMuted ? 'paused' : 'playing';
  });
}
pv.addEventListener('leavepictureinpicture', () => { clearInterval(pipTimer); status('docked'); });

async function onState(s) {
  if (s.persona !== persona) await loadPersona(s.persona);
  st = s;
  const tone = TINT[s.mood] || s.color || '#00ff9c';
  document.documentElement.style.setProperty('--tone', tone);
  $('tint').style.opacity = MIX[s.mood] ?? 0;
  $('frame').className = s.mood;
  $('name').textContent = s.name;
  document.title = s.name + ' / avatar7';
  if (s.seq !== seq) {
    seq = s.seq; text = s.line; clearInterval(typer); clearTimeout(fallback);
    // Muted, or no voice within a while: typed at a reading pace.
    fallback = setTimeout(() => typeOver(text.length * 45), s.isMuted ? 0 : 12000);
  }
  $('mute').textContent = s.isMuted ? 'unmute' : 'mute';
  if ('mediaSession' in navigator) {
    navigator.mediaSession.playbackState = s.isMuted ? 'paused' : 'playing';
    navigator.mediaSession.metadata = new MediaMetadata({ title: s.name, artist: 'avatar7' });
  }
  $('events').textContent = 'events: ' + (s.eventsOn ? 'on' : 'off'); $('events').classList.toggle('on', s.eventsOn);
  $('visits').textContent = 'visits: ' + (s.visitsOn ? 'on' : 'off'); $('visits').classList.toggle('on', s.visitsOn);
  $('volN').textContent = s.volume;
  if (s.session) status('session ' + s.session);
  $('answer').classList.toggle('open', !!s.question);
  if (s.question) $('answer').t.placeholder = 'answer: ' + s.question.slice(0, 60);
  $('picker').replaceChildren(...(s.avatars || []).map(a => {
    const b = document.createElement('button'); b.textContent = a.name; if (a.id === s.persona) b.className = 'cur';
    b.onclick = () => { send({ cmd: 'avatar', id: a.id }); $('picker').classList.remove('open'); }; return b;
  }));
  draw();
}

$('gate').onclick = () => {
  $('gate').remove();
  audio.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=';
  audio.play().catch(() => {});
  const es = new EventSource('/events');
  es.onopen = () => status('connected');
  es.onerror = () => status('lost, retrying');
  es.onmessage = m => { queue.push(m.data); next(); };
  es.addEventListener('state', m => onState(JSON.parse(m.data)));
};
</script></body></html>
